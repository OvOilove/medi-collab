spring:
  application:
    name: medi-referral
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: medicollab
      config:
        server-addr: 127.0.0.1:8848
        namespace: medicollab
        file-extension: yaml
  config:
    import:
      - optional:nacos:medi-referral.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/medicollab_referral?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /

server:
  port: 8084

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn
